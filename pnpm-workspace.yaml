packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@nestjs/common@12.4.0'
  - '@nestjs/core@12.4.0'
  - '@nestjs/platform-express@12.4.0'
  - '@nestjs/testing@12.4.0'
  - '@playwright/test@1.65.0'
  - playwright-core@1.65.0
  - playwright@1.65.0
